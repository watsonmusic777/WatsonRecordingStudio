<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WRSS Online Studio</title>
<link href="css/sync.css" rel="stylesheet" type="text/css">
<link href="css/splash.css" rel="stylesheet" type="text/css">

</head>

<body>
	
	
	<header class="wrss-header">
		
  <div class="wrss-header-inner">
   <img src="images/headerpic1.png" class="wrss-header-img" alt="WRSS Header">


  </div>
</header>

   <div class="signin-section">
    <h2 class="signin-title">Sign In</h2>
    <p class="signin-subtitle">Please sign in with the email and password you used when signing up.</p>

    <button class="signin-toggle">Sign In</button>

    <div class="signin-form" style="display:none;">
        <form>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button type="submit">Enter Studio</button>
        </form>
    </div>
</div>

<script>
document.querySelector('.signin-toggle').addEventListener('click', function() {
    const form = document.querySelector('.signin-form');
    form.style.display = (form.style.display === 'none') ? 'block' : 'none';
});
</script>
</body>
</html>
